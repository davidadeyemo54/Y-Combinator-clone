<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="David">
    <title>Flag</title>
    <link rel="stylesheet" href="flag.css">
</head>
<body class="body-colour">
<div class="flags">
    <div class="china-flag">
        <div class="star big-star"><img src="images/star image.png" alt="" class="img"></div>
        <div class="star s1"><img src="images/star image.png" alt="" class="img smallx"></div>
        <div class="star s2"><img src="images/star image.png" alt="" class="img smallx"></div>
        <div class="star s3"><img src="images/star image.png" alt="" class="img smallx"></div>
        <div class="star s4"><img src="images/star image.png" alt="" class="img smallx"></div>
    </div>
    <div class="paraguay-flag"> 
        <div class="stripe red"></div>
        <div class="stripe white">
            <div class="image-box"><img src="images/Paraguay 1.png" alt="" class="paraguay-img"></div>
        </div>
        <div class="stripe blue"></div>
    </div>
    <div class="russia-flag">
        <div class="str1 white1"></div>
        <div class="str1 blue2"></div>
        <div class="str1 red3"></div>
    </div>
    <div class="argentina-flag">
        <div class="white2">
            <div class="image-box2"><img src="images/Sun coat of arms of the argentinean flag argentine sun character illustration vector _ Premium Vector 1.png" alt="" class="argent-img"></div>
        </div>
    </div>
    <div class="brazil-flag">
        <div class="logo"><img src="images/Group 1 (2).png" alt="" class="logo-img"></div>
    </div>
    <div class="england-flag">
        <div class="str2 hor-red"></div>
        <div class="str2 ver-red"></div>
    </div>
    <div class="france-flag">
        <div class="str3 blue3"></div>
        <div class="str3 white3"></div>
        <div class="str3 red4"></div>
    </div>
    <div class="germany-flag">
        <div class="str4 black"></div>
        <div class="str4 red5"></div>
        <div class="str4 yellow"></div>
    </div>
    <div class="uruguay-flag">
        <div class="uruguay-logo-div">
        <img src="images/image 2 (16).png" alt="" class="uruguay-logo">
        </div>
        <div class="str5 blue4"></div>
        <div class="str5 blue5"></div>
        <div class="str5 blue6"></div>
        <div class="str5 blue7"></div>
    </div>
</div>

</body>
</html>
